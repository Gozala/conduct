name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The compiler as a component, built for `wasm32-unknown-unknown` and
  # run on the polyfill, and the demo that runs it in a browser.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            compiler
            demo
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.261.0,wasm-bindgen@0.2.126
      - run: cargo clippy --manifest-path compiler/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo fmt --manifest-path demo/Cargo.toml --check
      - run: cargo clippy --manifest-path demo/Cargo.toml --target wasm32-unknown-unknown --bins -- -D warnings
      - run: cargo test --manifest-path demo/Cargo.toml
      - run: demo/build.sh
      - run: cargo test --test compiler_component -- --nocapture
        env:
          CONDUCT_COMPILER_REQUIRED: "1"
      - name: Install Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run the demo in Chromium
        run: |
          python -m http.server 8087 --bind 127.0.0.1 --directory demo/dist &
          sleep 1
          python demo/tests/browser.py http://127.0.0.1:8087/
