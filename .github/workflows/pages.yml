name: Pages

# The demo, published to the `gh-pages` branch after each push to `main`,
# which GitHub Pages serves at https://gozala.github.io/conduct/. The
# site names its assets relative to its page, so it works at that path.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            compiler
            demo
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.261.0,wasm-bindgen@0.2.126
      - run: demo/build.sh
      # No Jekyll: the site is served as it is built.
      - run: touch demo/dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: demo/dist
          publish_branch: gh-pages
          force_orphan: true
