[package]
name = "conduct"
version = "0.1.0"
edition = "2024"
description = "A prototype language: Lisp syntax, hash-addressed definitions, inferred lattice types, compiled to Wasm components"

[lib]
path = "src/lib.rs"

[[bin]]
name = "conduct"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
wat = "1"
wit-component = "0.261"
wit-parser = "0.261"

[dev-dependencies]
# The polyfill runs the components the tests build, natively over
# Wasmtime's core engine, as it runs them in a browser over the
# `WebAssembly` API.
wcmp = { git = "https://github.com/dialog-db/wasm-component-model-polyfill" }
wcmp-wasm-core-wasmtime = { git = "https://github.com/dialog-db/wasm-component-model-polyfill" }
# The same Wasmtime the polyfill pins, for running plain core modules.
wasmtime = { version = "=49.0.0-rc.1", default-features = false, features = [
  "cranelift",
  "runtime",
  "component-model-async",
] }
# Wasmtime's own `wasi:http@0.3.0`, the reference the fetch glue is also
# checked against, with requests answered in process.
wasmtime-wasi-http = { version = "=49.0.0-rc.1", default-features = false, features = ["p3", "component-model-async"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "macros"] }
# The in-process todo API that answers the elements' requests in tests.
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2
