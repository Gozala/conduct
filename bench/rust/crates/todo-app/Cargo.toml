[package]
name = "todo-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
element-kit.workspace = true
wit-bindgen = { workspace = true, features = ["async-spawn"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
